name: Publish to nuget

on:
  push:
    branches:
      - main
    paths:
      - src/version.props
      - .github/workflows/nuget.yml

# The job checks out the repository and publishes to nuget.org with Trusted Publishing, so it needs
# read access to the contents and permission to request an OIDC token for the token exchange.
permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      # ⚠️ This one FIRST: Likvido.DbMigrator.EfCore takes a dependency on it, so publishing them the other
      # way round leaves a version of the migrator on nuget.org whose dependency does not exist yet.
      #
      # ⚠️ A new package id needs its own Trusted Publishing policy on nuget.org before this step can work -
      # Likvido has no reserved prefix, so the policy cannot be inherited. Until an owner creates it, this
      # step fails and the one below never runs.
      - name: Publish NuGet (Likvido.EfCore.MigrationsModel)
        uses: likvido/action-nuget@v2
        with:
          nuget-user: ${{ vars.NUGET_USER }}
          project: src/Likvido.EfCore.MigrationsModel/Likvido.EfCore.MigrationsModel.csproj

      - name: Publish NuGet (Likvido.DbMigrator.EfCore)
        uses: likvido/action-nuget@v2
        with:
          nuget-user: ${{ vars.NUGET_USER }}
          project: src/Likvido.DbMigrator.EfCore/Likvido.DbMigrator.EfCore.csproj
