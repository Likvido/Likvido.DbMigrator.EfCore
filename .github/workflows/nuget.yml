name: Publish to nuget

on:
  push:
    branches:
      - main
    paths:
      - src/version.props
      - .github/workflows/nuget.yml

# The job only checks out the repository and pushes the package to nuget.org, which is authenticated
# with NUGET_API_KEY rather than the job token, so read access to the contents is all it needs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Publish NuGet
        uses: likvido/action-nuget@v1
        with:
          nuget-key: ${{ secrets.NUGET_API_KEY }}
          project: src/Likvido.DbMigrator.EfCore/Likvido.DbMigrator.EfCore.csproj
